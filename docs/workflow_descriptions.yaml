docker.yaml: "Builds and pushes dev Docker images on PRs and manual dispatch. Production images are built and pushed by the Release workflow."
lint.yaml: "Runs linting checks using pre-commit hooks."
release.yaml: "Cuts a GitHub Release, publishes to PyPI, deploys versioned docs, and pushes the production Docker image when the version in pyproject.toml changes on main."
security.yaml: "Performs security checks using pip-audit."
test.yaml: "Runs unit tests and generates coverage reports."
