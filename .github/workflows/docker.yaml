name: Docker
on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use (defaults to "test")'
        default: 'test'

permissions: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash -l {0}

    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
      IMAGE_NAME: cpg_flow
      DOCKER_DEV: australia-southeast1-docker.pkg.dev/cpg-common/images-dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Log the PR commit sha
        if: github.event_name == 'pull_request'
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: 'echo "PR commit sha: $PR_SHA"'

      - id: 'google-cloud-auth'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          workload_identity_provider: 'projects/1051897107465/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-images-deployer@cpg-common.iam.gserviceaccount.com'

      - name: set up gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db #v3.0.1
        with:
          project_id: cpg-common

      - name: gcloud docker auth
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: build
        run: |
          docker build . -f Dockerfile --tag "$IMAGE_NAME:$GITHUB_SHA"

      - name: push commit sha tag
        if: github.event_name == 'pull_request'
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$DOCKER_DEV/$IMAGE_NAME:$PR_SHA"
          docker push "$DOCKER_DEV/$IMAGE_NAME:$PR_SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DOCKER_DEV/$IMAGE_NAME:$PR_SHA" | cut -d'@' -f2)
          echo "DOCKER_IMAGE=$DOCKER_DEV/$IMAGE_NAME:$PR_SHA" >> "$GITHUB_ENV"
          echo "DOCKER_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: manually triggered build
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$DOCKER_DEV/$IMAGE_NAME:$TAG"
          docker push "$DOCKER_DEV/$IMAGE_NAME:$TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DOCKER_DEV/$IMAGE_NAME:$TAG" | cut -d'@' -f2)
          echo "DOCKER_IMAGE=$DOCKER_DEV/$IMAGE_NAME:$TAG" >> "$GITHUB_ENV"
          echo "DOCKER_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Add image link to GitHub Summary
        if: env.DOCKER_IMAGE != ''
        run: |
          echo "## 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${DOCKER_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${DOCKER_IMAGE}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "${DOCKER_DIGEST:-}" ]; then
            GCP_LINK="https://console.cloud.google.com/artifacts/docker/cpg-common/australia-southeast1/images-dev/${IMAGE_NAME}/${DOCKER_DIGEST}"
          else
            GCP_LINK="https://console.cloud.google.com/artifacts/docker/cpg-common/australia-southeast1/images-dev/${IMAGE_NAME}"
          fi
          echo "**🔗 [View in Google Cloud Console](${GCP_LINK})**" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with Docker image
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${DOCKER_IMAGE:-}" ]; then
            echo "No Docker image found, skipping PR comment"
            exit 0
          fi

          if [ -n "${DOCKER_DIGEST:-}" ]; then
            GCP_LINK="https://console.cloud.google.com/artifacts/docker/cpg-common/australia-southeast1/images-dev/${IMAGE_NAME}/${DOCKER_DIGEST}"
          else
            GCP_LINK="https://console.cloud.google.com/artifacts/docker/cpg-common/australia-southeast1/images-dev/${IMAGE_NAME}"
          fi

          MARKER="<!-- cpg-flow-docker -->"

          BODY="${MARKER}
          ## 🐳 Docker Image Built

          A new Docker image has been built for this PR:

          **Image:** \`${DOCKER_IMAGE}\`

          **Pull command:**
          \`\`\`bash
          docker pull ${DOCKER_IMAGE}
          \`\`\`

          **🔗 [View in Google Cloud Console](${GCP_LINK})**

          ---
          *This comment was automatically generated by the Docker workflow.*"

          # Find existing comment with our marker
          COMMENT_ID=$(gh api \
            --paginate \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY" \
              --silent
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" \
              --silent
          fi
