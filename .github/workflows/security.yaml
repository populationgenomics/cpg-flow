name: Security Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  package-scanner:
    runs-on: ubuntu-latest
    name: Python Package Scanner
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          persist-credentials: false

      - uses: populationgenomics/python-package-scanner@8a87547b5d131c4514cff5bd381f804f84e0c1cd # v0
        with:
          mode: uv
          fail-on-vulns: true
          comment-on-pr: true
          ignore-ids: "GHSA-8qvm-5x2c-j2w7" # Denial of service in protobuf=3.20.2; hail pins this version.

  zizmor:
    name: Zizmor Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 #v7.6.0

      - name: Run zizmor 🌈
        run: uvx zizmor@1.6.0 --format=sarif . > results.sarif

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: zizmor
