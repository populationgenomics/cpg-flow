name: Release
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b #v8.1.0
        with:
          enable-cache: false

      - name: Compare version to latest tag
        id: check
        run: |
          VERSION=$(uv version --short)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Current version: $VERSION"
          echo "Latest tag: $LATEST_TAG"
          if [ "v${VERSION}" = "${LATEST_TAG}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes

  # Jobs are serialised so a failure short-circuits later, irreversible steps:
  # Docker build catches Dockerfile breakage before the PyPI publish (which
  # cannot re-upload the same version), and the docs `latest` alias only moves
  # once both artefacts are out.
  push-docker:
    name: Push Production Docker Image
    needs: [check-version, create-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash -l {0}
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
      IMAGE_NAME: cpg_flow
      DOCKER_MAIN: australia-southeast1-docker.pkg.dev/cpg-common/images
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          workload_identity_provider: 'projects/1051897107465/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-images-deployer@cpg-common.iam.gserviceaccount.com'

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db #v3.0.1
        with:
          project_id: cpg-common

      - name: Configure docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Build image
        run: docker build . -f Dockerfile --tag "$IMAGE_NAME:$GITHUB_SHA"

      - name: Tag and push production image
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$DOCKER_MAIN/$IMAGE_NAME:$VERSION"
          docker push "$DOCKER_MAIN/$IMAGE_NAME:$VERSION"

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, push-docker]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b #v8.1.0
        with:
          enable-cache: false

      - name: Install project dependencies
        run: uv sync

      - name: Build package
        run: uv build --sdist --wheel

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b #v1.14.0

  deploy-docs:
    name: Deploy versioned docs
    needs: [check-version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -l {0}
    steps:
      # Persisted credentials are required so `mike deploy --push` can push to
      # gh-pages. This job uploads no artifacts, so the token cannot leak via
      # actions/upload-artifact.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b #v8.1.0
        with:
          enable-cache: false

      - name: Install project dependencies
        run: uv sync

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate changelog page from GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "# 📈 Releases & Changelog"
            echo
            echo "Release notes for every published version, generated from [GitHub Releases](https://github.com/${REPO}/releases) at docs build time."
            echo
            echo "## 🏷️ <a href=\"https://github.com/${REPO}/releases\" target=\"_blank\">All releases for this project are available here</a>."
            echo
            gh api --paginate "/repos/${REPO}/releases?per_page=100" --jq '
              .[] | "## \(.name // .tag_name)\n\n_Released \(.published_at | sub("T.*"; ""))_\n\n\(.body)\n"
            '
          } > docs/docs/changelog.md

      - name: Deploy versioned docs
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          uv run mike deploy -F docs/mkdocs.yml --push --alias-type=redirect --update-aliases "$VERSION" latest
          uv run mike set-default -F docs/mkdocs.yml --push latest
